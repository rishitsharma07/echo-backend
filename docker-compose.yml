services:
  db:
    image: postgres:16
    container_name: echo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpass
    ports:
      - "5432:5432"
    volumes:
      - echo-db-data:/var/lib/postgresql/data

volumes:
  echo-db-data: