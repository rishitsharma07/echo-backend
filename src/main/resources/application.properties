spring.application.name=blog-api
server.port=8080

# H2 Database (file-based for persistence)
spring.datasource.url=jdbc:h2:file:./data/blogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=blog-platform-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256
app.jwt.expiration=86400000
